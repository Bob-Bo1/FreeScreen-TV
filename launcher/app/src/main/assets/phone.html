<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeScreen TV 手机传文件</title><style>body{font:17px system-ui;background:#132031;color:#fff;max-width:560px;margin:0 auto;padding:28px 20px}h1{font-size:27px}section{background:#223247;border-radius:18px;padding:20px;margin:18px 0}input,button{font:inherit;box-sizing:border-box;max-width:100%;margin-top:14px}input[type=url]{width:100%;padding:12px;border-radius:8px;border:0}button{padding:12px 20px;background:#b8e2ff;border:0;border-radius:10px;color:#142b42}p{line-height:1.6;color:#c8d6e6}#status{position:sticky;bottom:12px;background:#354c64;padding:16px;border-radius:12px}small{color:#bdcddd}</style><h1>FreeScreen TV</h1><p>手机传文件 · 与电视连接同一网络<br>保持电视传输页面开启，上传后在电视确认。</p><section><h2>上传壁纸</h2><small>JPG、PNG、WebP，最大20MB；推荐横图。</small><input id="wallpaper" type="file" accept="image/jpeg,image/png,image/webp"><button onclick="send('wallpaper')">上传壁纸</button></section><section><h2>安装应用</h2><small>选择 APK，最大256MB，安装需在电视确认。</small><input id="apk" type="file" accept=".apk,application/vnd.android.package-archive"><button onclick="send('apk')">上传安装包</button></section><div id="status" role="status">等待选择文件</div><script>let uploading=false;function send(kind){if(uploading)return;const el=document.getElementById(kind);const data=el.files[0];if(!data){say('请先选择文件');return}{if(data.size>(kind==='apk'?256:20)*1024*1024){say('文件过大');return}if(kind==='apk'&&!data.name.toLowerCase().endsWith('.apk')){say('请选择 APK 文件');return}}uploading=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);const x=new XMLHttpRequest();x.open('POST',new URL(kind,location.href));x.timeout=300000;x.upload.onprogress=e=>{say(e.lengthComputable?'正在上传 '+Math.round(e.loaded/e.total*100)+'%':'正在上传…')};x.onload=()=>{say(x.responseText||'请查看电视');end()};x.onerror=()=>{say('连接中断，请确认电视传输页面仍开启');end()};x.ontimeout=()=>{say('上传超时，请重试');end()};x.send(data)}function say(s){document.getElementById('status').textContent=s}function end(){uploading=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}</script></html>
